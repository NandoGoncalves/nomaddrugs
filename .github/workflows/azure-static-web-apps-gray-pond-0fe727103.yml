name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Le dossier api est construit isolément et ne peut pas remonter chercher
      # le moteur : on lui en dépose une copie. La source reste moteur/echeancier.js.
      - name: Copier le moteur dans l'API
        run: |
          mkdir -p api/moteur
          cp moteur/echeancier.js api/moteur/echeancier.js
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_0FE727103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github