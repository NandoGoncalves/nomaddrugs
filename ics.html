<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoMAD DRUgS — téléchargement de l'échéancier</title>
<style>
  :root{
    --paper:#FFFFFF;
    --card:#DEF2EB;
    --ink:#12302C;
    --ink-soft:#4F6F69;
    --rule:#BCE1D9;
    --brand:#00A79B;
    --brand-deep:#00786F;
    --brand-darker:#005E57;
    --lime:#B4E017;
    --orange:#F5820B;
    --rasp:#E62E6B;
    --alert:#C21550;
    --alert-bg:#FFE8F0;
    --r:9px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;
  }
  body::before{
    content:"";display:block;height:7px;
    background:linear-gradient(90deg,
      var(--brand) 0 25%, var(--lime) 25% 50%,
      var(--orange) 50% 75%, var(--rasp) 75% 100%);
  }
  .wrap{max-width:34rem;margin:0 auto;padding:3rem 1.25rem 4rem;text-align:center}
  h1{
    font-size:1.75rem;line-height:1.1;margin:0 0 .4rem;
    font-weight:700;letter-spacing:-.02em;color:var(--brand-deep);
  }
  .version{font-size:.7rem;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 2rem}
  .card{background:var(--card);border-radius:16px;padding:1.5rem 1.4rem;margin:0 0 1.25rem}
  .resume{font-size:.95rem;margin:0 0 1.2rem}
  .resume b{font-size:1.15rem;display:block;margin-bottom:.15rem}
  .btn{
    border:1px solid var(--brand-deep);background:var(--brand-deep);color:#fff;
    padding:.75rem 1.5rem;border-radius:var(--r);cursor:pointer;font-weight:600;
    font-size:1rem;font-family:inherit;
  }
  .btn:hover{background:var(--brand-darker);border-color:var(--brand-darker)}
  .btn:focus-visible{outline:2px solid var(--brand-deep);outline-offset:2px}
  .note{font-size:.8rem;color:var(--ink-soft);margin:1rem auto 0;max-width:26rem;line-height:1.45}
  .erreur{
    border:1px solid var(--rasp);background:var(--alert-bg);border-radius:var(--r);
    padding:1rem 1.15rem;text-align:left;font-size:.9rem;
  }
  .erreur ul{margin:.5rem 0 0;padding-left:1.1rem}
  .erreur li{margin:.25rem 0}
  a{color:var(--brand-deep)}
  .retour{display:block;margin-top:1.5rem;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>N<i>o</i>MAD DRU<i>g</i>S</h1>
  <p class="version" id="version"></p>
  <div id="sortie"></div>
  <a class="retour" href="index.html" id="retour">Ouvrir le formulaire complet</a>
</div>

<script src="moteur/echeancier.js"></script>
<script>
"use strict";

const VERSION = "0.1.0";
const E = NomadEngine;
const el = id => document.getElementById(id);

el("version").textContent = "v" + VERSION + " · moteur " + E.VERSION;

/* Les paramètres voyagent dans le fragment : ils ne sont jamais transmis au
   serveur. Le fichier est fabriqué ici, dans le navigateur. */
function lireFragment() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return null;
  const p = new URLSearchParams(h);
  if (!p.has("p") && !p.has("o") && !p.has("d")) return null;
  return {
    pattern: p.get("p") || "",
    targets: p.has("t") ? p.get("t") : null,
    tzOrigin: p.get("o") || "",
    tzDest: p.get("d") || "",
    dateStart: p.get("s") || "",
    dateEnd: p.get("e") || "",
    lag: p.get("l"),
    subject: p.has("n") ? p.get("n") : "Prise du traitement",
    description: p.has("m") ? p.get("m") : ""
  };
}

function echapper(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function erreur(titre, lignes) {
  el("sortie").innerHTML = '<div class="erreur"><b>' + echapper(titre) + "</b>" +
    (lignes && lignes.length
      ? "<ul>" + lignes.map(l => "<li>" + echapper(l) + "</li>").join("") + "</ul>"
      : "") + "</div>";
}

function frDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? m[3] + "/" + m[2] + "/" + m[1] : iso;
}

function demarrer() {
  const cfg = lireFragment();
  if (!cfg) {
    erreur("Aucune configuration dans ce lien.",
      ["Cette page fabrique le fichier d'agenda à partir des paramètres reçus dans l'adresse.",
       "Passez par le formulaire pour composer un échéancier."]);
    return;
  }

  /* Date de fin absente : on va jusqu'au jour où l'horaire visé est atteint,
     comme le fait le formulaire. */
  if (!cfg.dateEnd) {
    const c = E.convergenceDay(cfg);
    if (c !== null) cfg.dateEnd = E.isoDay(c);
  }

  const r = E.computeSchedule(cfg);
  if (!r.ok) { erreur("Ce lien ne permet pas de calculer un échéancier.", r.errors.map(e => e.message || e)); return; }

  const texte = E.buildIcs(r, { appVersion: VERSION + " moteur " + E.VERSION });
  const nom = "nomaddrugs-" + r.v.dateStart + "-" + r.v.dateEnd + ".ics";
  const blob = new Blob([texte], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const jours = r.daysAvailable + 1;
  el("sortie").innerHTML =
    '<div class="card">' +
      '<p class="resume"><b>' + r.rows.length + (r.rows.length > 1 ? " prises" : " prise") + "</b>" +
      "du " + frDate(r.v.dateStart) + " au " + frDate(r.v.dateEnd) +
      " · " + jours + (jours > 1 ? " jours" : " jour") + "</p>" +
      '<button type="button" class="btn" id="telecharger">Télécharger le fichier</button>' +
    "</div>" +
    '<p class="note">Le téléchargement démarre tout seul. Si rien ne se passe, utilisez le bouton. ' +
    "Rien n'a été envoyé : le fichier a été fabriqué dans ce navigateur.</p>";

  const lancer = () => {
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  el("telecharger").addEventListener("click", lancer);

  /* Tentative immédiate : certains navigateurs mobiles la refusent faute de
     geste de l'utilisateur, d'où le bouton qui reste toujours disponible. */
  try { lancer(); } catch (e) {}

  el("retour").href = "index.html" + location.hash;
}

demarrer();
window.addEventListener("hashchange", demarrer);
</script>
</body>
</html>
